[project]
name = "thanados"
version = "0.1.0"
description = "An open source, web application for the presentation of archaeological data"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Stefan Eichert" }
]
license = { text = "MIT" }
dependencies = [
    "bcrypt~=4.2.0",
    "beautifulsoup4~=4.13.4",
    "email-validator==2.2.0",
    "flasgger==0.9.7.1",
    "flask==3.1.1",
    "flask-babel==4.0.0",
    "flask-cors==6.0.1",
    "flask-jwt-extended==4.7.1",
    "flask-login==0.6.3",
    "flask-restful==0.3.10",
    "flask-wtf==1.2.2",
    "fuzzywuzzy==0.18.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "lxml~=5.3.0",
    "markdown==3.7",
    "markupsafe==2.1.5",
    "numpy==2.2.4",
    "pandas==2.2.3",
    "psycopg2-binary>=2.9.11",
    "pyjwt==2.10.1",
    "python-dateutil==2.9.0",
    "python-gettext==4.0",
    "pyyaml~=6.0.1",
    "rapidfuzz>=3.14.3",
    "rdflib==7.1.1",
    "requests==2.32.3",
    "shapely~=2.1.0",
    "svgwrite~=1.4.3",
    "unidecode~=1.3.8",
    "validators~=0.20.0",
    "wand==0.6.13",
    "werkzeug==3.1.3",
    "wtforms==3.1.2",
    "xmltodict==0.13.0",
    "pytest>=5.1.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.6.0",
    "fiona>=1.10.0",
    "iiif-prezi3>=3.1.0",
    "pylint>=4.0.7",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
managed = true

[tool.setuptools]
packages = ["thanados"]
